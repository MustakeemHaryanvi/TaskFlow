<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TaskFlow - Register</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #2563eb,
                #4f46e5
            );

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .register-container {
            width: 100%;

            max-width: 420px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.20);
        }

        .logo {
            text-align: center;

            margin-bottom: 25px;
        }

        .logo h1 {
            margin: 0;

            color: #2563eb;

            font-size: 32px;
        }

        .logo p {
            color: #666;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #999;

            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;

            padding: 10px;

            border-radius: 7px;

            display: none;

            text-align: center;
        }

        .error {
            background: #fee2e2;

            color: #b91c1c;
        }

        .success {
            background: #dcfce7;

            color: #15803d;
        }

        .login-link {
            margin-top: 20px;

            text-align: center;

            color: #555;
        }

        .login-link a {
            color: #2563eb;

            font-weight: bold;

            text-decoration: none;
        }

    </style>

</head>


<body>

    <div class="register-container">

        <div class="logo">

            <h1>TaskFlow</h1>

            <p>
                Create your account
            </p>

        </div>


        <form id="registerForm">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 6 characters"
                    minlength="6"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Enter password again"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                id="registerButton"
            >
                Create Account
            </button>

        </form>


        <div
            id="message"
            class="message"
        ></div>


        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>


    <script src="auth.js"></script>


    <script>

        // =================================================
        // REGISTER
        // =================================================

        document
            .getElementById("registerForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const name =
                        document
                        .getElementById("name")
                        .value
                        .trim();


                    const email =
                        document
                        .getElementById("email")
                        .value
                        .trim();


                    const password =
                        document
                        .getElementById("password")
                        .value;


                    const confirmPassword =
                        document
                        .getElementById("confirmPassword")
                        .value;


                    const button =
                        document
                        .getElementById(
                            "registerButton"
                        );


                    const message =
                        document
                        .getElementById("message");


                    // =================================
                    // PASSWORD MATCH
                    // =================================

                    if (
                        password !==
                        confirmPassword
                    ) {

                        message.className =
                            "message error";

                        message.textContent =
                            "Passwords do not match.";

                        message.style.display =
                            "block";

                        return;
                    }


                    if (password.length < 6) {

                        message.className =
                            "message error";

                        message.textContent =
                            "Password must be at least 6 characters.";

                        message.style.display =
                            "block";

                        return;
                    }


                    button.disabled = true;

                    button.textContent =
                        "Creating account...";


                    try {

                        const response =
                            await fetch(
                                `${API_BASE_URL}/users`,
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body: JSON.stringify({

                                        name: name,

                                        email: email,

                                        password: password

                                    })
                                }
                            );


                        const data =
                            await response.json();


                        if (!response.ok) {

                            throw new Error(
                                data.detail ||
                                "Registration failed"
                            );
                        }


                        message.className =
                            "message success";

                        message.textContent =
                            "Account created successfully! Redirecting to login...";

                        message.style.display =
                            "block";


                        setTimeout(
                            function() {

                                window.location.href =
                                    "login.html";

                            },
                            1000
                        );


                    } catch (error) {

                        console.error(error);


                        message.className =
                            "message error";

                        message.textContent =
                            error.message;

                        message.style.display =
                            "block";


                        button.disabled =
                            false;

                        button.textContent =
                            "Create Account";
                    }

                }
            );

    </script>

</body>

</html>
