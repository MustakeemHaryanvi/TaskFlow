<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TaskFlow - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #2563eb,
                #4f46e5
            );

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.20);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            margin: 0;

            color: #2563eb;

            font-size: 32px;
        }

        .logo p {
            margin-top: 8px;

            color: #666;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #999;

            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;

            padding: 10px;

            border-radius: 7px;

            display: none;

            text-align: center;
        }

        .error {
            background: #fee2e2;

            color: #b91c1c;
        }

        .success {
            background: #dcfce7;

            color: #15803d;
        }

        .register-link {
            margin-top: 20px;

            text-align: center;

            color: #555;
        }

        .register-link a {
            color: #2563eb;

            font-weight: bold;

            text-decoration: none;
        }

    </style>

</head>


<body>

    <div class="login-container">

        <div class="logo">

            <h1>TaskFlow</h1>

            <p>
                Task & Project Management
            </p>

        </div>


        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                id="loginButton"
            >
                Login
            </button>

        </form>


        <div
            id="message"
            class="message"
        ></div>


        <div class="register-link">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </div>

    </div>


    <script src="auth.js"></script>


    <script>

        // =================================================
        // LOGIN
        // =================================================

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const email =
                        document
                        .getElementById("email")
                        .value
                        .trim();


                    const password =
                        document
                        .getElementById("password")
                        .value;


                    const button =
                        document
                        .getElementById("loginButton");


                    const message =
                        document
                        .getElementById("message");


                    button.disabled = true;

                    button.textContent =
                        "Logging in...";


                    message.style.display =
                        "none";


                    try {

                        const response =
                            await fetch(
                                `${API_BASE_URL}/login`,
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body: JSON.stringify({
                                        email: email,
                                        password: password
                                    })
                                }
                            );


                        const data =
                            await response.json();


                        if (!response.ok) {

                            throw new Error(
                                data.detail ||
                                "Login failed"
                            );
                        }


                        // =================================
                        // SAVE JWT
                        // =================================

                        saveToken(
                            data.access_token
                        );


                        // =================================
                        // SAVE USER
                        // =================================

                        saveUser(
                            data.user
                        );


                        message.className =
                            "message success";

                        message.textContent =
                            "Login successful! Opening dashboard...";

                        message.style.display =
                            "block";


                        // =================================
                        // OPEN DASHBOARD
                        // =================================

                        setTimeout(
                            function() {

                                window.location.href =
                                    "index.html";

                            },
                            500
                        );


                    } catch (error) {

                        console.error(error);


                        message.className =
                            "message error";

                        message.textContent =
                            error.message;

                        message.style.display =
                            "block";


                        button.disabled =
                            false;

                        button.textContent =
                            "Login";
                    }

                }
            );

    </script>

</body>

</html>
